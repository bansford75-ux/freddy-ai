<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Freddy AI</title>

<style>
:root{
  --bg:#000;
  --panel:#202020;
  --panel2:#2b2b2b;
  --border:#414141;
  --text:#f5f5f5;
  --muted:#b9b9b9;
  --blue:#58a9ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Inter,
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body{
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  color:inherit;
}

.app{
  height:100dvh;
  width:100%;
  display:flex;
  overflow:hidden;
  background:#000;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:280px;
  background:#171717;
  display:flex;
  flex-direction:column;
  padding:12px;
  gap:8px;
  z-index:50;
  position:fixed;
  inset:0 auto 0 0;
  transform:translateX(-105%);
  transition:transform .22s ease;
  box-shadow:20px 0 70px #000;
}

.sidebar.open{
  transform:translateX(0);
}

.newchat{
  height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #404040;
  background:#242424;
  border-radius:12px;
  padding:0 13px;
  cursor:pointer;
}

.newchat:hover,
.sidebtn:hover,
.chatrow:hover{
  background:#303030;
}

.search{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aaa;
  background:#222;
  border:1px solid #333;
  padding:9px 11px;
  border-radius:10px;
}

.search input{
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:white;
}

.history{
  flex:1;
  overflow:auto;
}

.chatrow{
  padding:10px;
  border-radius:9px;
  display:flex;
  gap:8px;
  cursor:pointer;
  font-size:14px;
}

.chatrow span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sidebottom{
  border-top:1px solid #303030;
  padding-top:7px;
}

.sidebtn{
  display:block;
  width:100%;
  border:0;
  background:none;
  text-align:left;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:45;
}

.overlay.show{
  display:block;
}

/* =========================
   MAIN
========================= */

.main{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  background:#000;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:92px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 28px 12px;
  position:relative;
  z-index:10;
  background:#000;
}

.top-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.menu,
.voice-top{
  width:60px;
  height:60px;
  border-radius:50%;
  border:1px solid #444;
  background:#202020;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:inset 0 1px #ffffff12;
}

.menu:hover,
.voice-top:hover{
  background:#2b2b2b;
}

.menu-lines{
  width:25px;
  display:grid;
  gap:7px;
}

.menu-lines i{
  height:3px;
  background:#eee;
  border-radius:3px;
  display:block;
}

.plus-pill{
  height:60px;
  padding:0 27px;
  border-radius:31px;
  border:1px solid #4b5157;
  background:linear-gradient(145deg,#303a43,#283038);
  color:#59aaff;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:700;
  box-shadow:inset 0 1px #ffffff18;
}

.plus-star{
  font-size:28px;
  color:#63b5ff;
  line-height:1;
}

.voice-top svg{
  width:31px;
  height:31px;
  stroke:#f2f2f2;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow:auto;
  padding:0 24px 180px;
  position:relative;
  scroll-behavior:smooth;
}

.empty{
  max-width:720px;
  margin:0 auto;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-bottom:118px;
}

.empty .face{
  display:none;
}

.empty h1{
  display:none;
}

.empty p{
  display:none;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions{
  display:flex;
  flex-direction:column;
  gap:29px;
  margin:0 0 18px 26px;
  align-items:flex-start;
}

.suggestions button{
  border:0;
  background:transparent;
  padding:0;
  color:#e8e8e8;
  font-size:24px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:22px;
  text-align:left;
}

.suggestions button:before{
  content:"";
  width:34px;
  height:34px;
  display:inline-grid;
  place-items:center;
  flex:0 0 34px;
}

.suggestions button:nth-child(1):before{
  content:"♧";
  font-size:39px;
  font-weight:400;
  transform:rotate(180deg);
}

.suggestions button:nth-child(2):before{
  content:"▧";
  font-size:36px;
  font-weight:400;
}

.suggestions button:nth-child(3):before{
  content:"⌕";
  font-size:42px;
  font-weight:300;
}

.suggestions button:nth-child(4):before{
  content:"✦";
  font-size:31px;
}

/* =========================
   MESSAGES
========================= */

.message{
  max-width:820px;
  margin:0 auto 27px;
  display:flex;
  gap:13px;
  line-height:1.65;
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:50%;
  background:#444;
  display:grid;
  place-items:center;
  font-size:12px;
}

.user .avatar{
  order:2;
  background:#eee;
  color:#222;
}

.content{
  max-width:calc(100% - 44px);
  overflow-wrap:anywhere;
}

.user .content{
  background:#2f2f2f;
  padding:10px 14px;
  border-radius:18px;
  max-width:min(720px,85%);
}

.ai .content,
.assistant .content{
  padding-top:1px;
}

.content pre{
  background:#151515;
  border:1px solid #444;
  padding:14px;
  border-radius:10px;
  overflow:auto;
}

.content code{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

.content ul,
.content ol{
  padding-left:22px;
}

.attachment{
  display:flex;
  align-items:center;
  gap:8px;
  background:#292929;
  border:1px solid #444;
  padding:7px 9px;
  border-radius:9px;
  margin-bottom:8px;
  max-width:320px;
}

.attachment img{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:6px;
}

/* =========================
   TYPING
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  height:24px;
}

.typing i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
  animation:typing .9s infinite ease-in-out;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  40%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:0 24px 20px;
  background:linear-gradient(transparent,#000 30%);
}

.composer{
  max-width:820px;
  margin:auto;
  background:#242424;
  border:1px solid #454545;
  border-radius:32px;
  padding:8px 10px 8px 8px;
  box-shadow:0 10px 50px #000;
}

.preview{
  display:none;
  gap:8px;
  overflow:auto;
  padding:3px 5px 8px;
}

.preview.show{
  display:flex;
}

.preview-item{
  position:relative;
}

.preview-item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:9px;
}

.remove{
  position:absolute;
  right:-5px;
  top:-5px;
  border:0;
  border-radius:50%;
  background:#444;
  width:20px;
  height:20px;
  cursor:pointer;
}

.inputrow{
  display:flex;
  align-items:center;
  gap:7px;
}

textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:160px;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  padding:12px 7px;
  font-size:21px;
}

textarea::placeholder{
  color:#aaa;
}

.attach{
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  background:transparent;
  font-size:42px;
  font-weight:300;
  line-height:1;
  cursor:pointer;
  color:#eee;
  display:grid;
  place-items:center;
}

.attach:hover{
  background:#333;
}

.send{
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#111;
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:700;
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.hint{
  text-align:center;
  color:#888;
  font-size:11px;
  margin-top:9px;
}

/* =========================
   LIGHT MODE
========================= */

body.light{
  background:#f5f5f5;
  color:#111;
}

body.light .main{
  background:#f5f5f5;
}

body.light .topbar{
  background:#f5f5f5;
}

body.light .chat{
  background:#f5f5f5;
}

body.light .composer-wrap{
  background:linear-gradient(transparent,#f5f5f5 30%);
}

body.light .composer{
  background:#fff;
  border-color:#ccc;
}

body.light textarea{
  color:#111;
}

body.light .suggestions button{
  color:#222;
}

body.light .user .content{
  background:#ddd;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:801px){

  .menu,
  .voice-top{
    width:46px;
    height:46px;
  }

  .plus-pill{
    height:46px;
    font-size:17px;
    padding:0 20px;
  }

  .plus-star{
    font-size:22px;
  }

  .topbar{
    height:72px;
    padding:12px 20px;
  }

  .suggestions button{
    font-size:19px;
  }

  .suggestions{
    gap:23px;
    margin-left:10px;
  }

  .empty{
    padding-bottom:110px;
  }

  textarea{
    font-size:16px;
  }

  .attach,
  .send{
    width:42px;
    height:42px;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    height:104px;
    padding:18px 28px 10px;
  }

  .menu,
  .voice-top{
    width:60px;
    height:60px;
  }

  .plus-pill{
    height:60px;
    font-size:21px;
    padding:0 25px;
  }

  .chat{
    padding:0 16px 180px;
  }

  .empty{
    padding-bottom:110px;
  }

  .suggestions{
    gap:28px;
    margin-left:22px;
  }

  .suggestions button{
    font-size:23px;
    gap:19px;
  }

  .composer-wrap{
    padding:0 25px 20px;
  }

  .composer{
    border-radius:31px;
  }

  textarea{
    font-size:20px;
  }

  .attach,
  .send{
    width:52px;
    height:52px;
  }

  .hint{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button class="newchat" id="newChat">
      ＋ <span>New chat</span>
    </button>

    <label class="search">
      ⌕
      <input id="search" placeholder="Search chats">
    </label>

    <div class="history" id="history"></div>

    <div class="sidebottom">
      <button class="sidebtn" id="theme">
        ☼ &nbsp; Theme
      </button>

      <button class="sidebtn" id="clearAll">
        ⌫ &nbsp; Clear history
      </button>
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <section class="main">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="top-left">

        <button
          class="menu"
          id="menu"
          aria-label="Open menu"
        >
          <span class="menu-lines">
            <i></i>
            <i></i>
          </span>
        </button>

        <div class="plus-pill">
          <span class="plus-star">✦</span>
          Get Plus
        </div>

      </div>

      <button
        class="voice-top"
        id="voice"
        title="Start voice chat"
        aria-label="Start voice chat"
      >

        <svg viewBox="0 0 48 48" fill="none">

          <path
            d="M10 19c2-7 7-10 14-10 7 0 12 3 14 10"
            stroke-width="3.5"
            stroke-linecap="round"
          />

          <path
            d="M10 29c2 7 7 10 14 10 7 0 12-3 14-10"
            stroke-width="3.5"
            stroke-linecap="round"
          />

          <path
            d="M8 21v6M40 21v6"
            stroke-width="3.5"
            stroke-linecap="round"
          />

          <path
            d="M15 18v12M33 18v12"
            stroke-width="3.5"
            stroke-linecap="round"
          />

        </svg>

      </button>

    </header>

    <!-- CHAT -->
    <main class="chat" id="chat"></main>

    <!-- COMPOSER -->
    <div class="composer-wrap">

      <form class="composer" id="form">

        <div
          class="preview"
          id="preview"
        ></div>

        <div class="inputrow">

          <input
            id="file"
            type="file"
            accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.html,.css"
            multiple
            hidden
          >

          <button
            class="attach"
            type="button"
            id="attach"
            title="Attach files"
          >
            ＋
          </button>

          <textarea
            id="input"
            rows="1"
            placeholder="Ask Freddy"
          ></textarea>

          <button
            class="send"
            id="send"
            type="submit"
          >
            ↑
          </button>

        </div>

      </form>

      <div class="hint">
        Freddy can make mistakes. Check important information.
      </div>

    </div>

  </section>

</div>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const $ = selector => document.querySelector(selector);

const chat = $("#chat");
const input = $("#input");
const form = $("#form");
const file = $("#file");
const preview = $("#preview");
const sendButton = $("#send");

let conversations =
  JSON.parse(localStorage.getItem("freddy_chats") || "[]");

let currentId =
  localStorage.getItem("freddy_current") || null;

let attachments = [];

let isSending = false;


/* =========================================================
   STORAGE
========================================================= */

function save(){

  localStorage.setItem(
    "freddy_chats",
    JSON.stringify(conversations)
  );

  localStorage.setItem(
    "freddy_current",
    currentId || ""
  );

}


/* =========================================================
   CURRENT CHAT
========================================================= */

function current(){

  return conversations.find(
    c => c.id === currentId
  );

}


/* =========================================================
   CREATE NEW CHAT
========================================================= */

function fresh(){

  const c = {
    id:
      crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(),

    title:"New chat",

    messages:[],

    created:Date.now()
  };

  conversations.unshift(c);

  currentId = c.id;

  save();

  renderHistory();

  renderChat();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value || "").replace(
    /[&<>"]/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    })[character]
  );

}


/* =========================================================
   MARKDOWN
========================================================= */

function md(value){

  let x = escapeHTML(value);

  x = x.replace(
    /```([\s\S]*?)```/g,
    (_, code) =>
      `<pre><code>${code.trim()}</code></pre>`
  );

  x = x.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  x = x.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  x = x.replace(
    /\n/g,
    "<br>"
  );

  return x;

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(filter = ""){

  const history = $("#history");

  history.innerHTML = "";

  conversations
    .filter(c =>
      c.title
        .toLowerCase()
        .includes(filter.toLowerCase())
    )
    .slice(0,80)
    .forEach(c => {

      const button =
        document.createElement("div");

      button.className = "chatrow";

      button.innerHTML =
        `💬 <span>${escapeHTML(c.title)}</span>`;

      button.onclick = () => {

        currentId = c.id;

        save();

        renderChat();

        closeSide();

      };

      history.appendChild(button);

    });

}


/* =========================================================
   RENDER CHAT
========================================================= */

function renderChat(){

  const c = current();

  chat.innerHTML = "";

  if(!c || !c.messages.length){

    chat.innerHTML = `
      <section class="empty">

        <div class="face">
          <div class="prompt">&gt;_</div>
        </div>

        <h1>What can I help with?</h1>

        <p>
          I'm Freddy — your AI assistant.
        </p>

        <div class="suggestions">

          <button>
            Start a voice chat
          </button>

          <button>
            Create an image or sticker
          </button>

          <button>
            Write or edit
          </button>

        </div>

      </section>
    `;

    chat
      .querySelectorAll(".suggestions button")
      .forEach(button => {

        button.onclick = () => {

          input.value =
            button.textContent.trim();

          input.focus();

          input.dispatchEvent(
            new Event("input")
          );

        };

      });

    return;

  }


  c.messages.forEach(message => {

    const row =
      document.createElement("div");

    row.className =
      "message " + message.role;


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      message.role === "user"
        ? "You"
        : "F";


    const content =
      document.createElement("div");

    content.className = "content";


    /* Image */

    if(message.image){

      const attachment =
        document.createElement("div");

      attachment.className =
        "attachment";

      const image =
        document.createElement("img");

      image.src = message.image;

      image.alt =
        message.name || "Image";


      const name =
        document.createElement("span");

      name.textContent =
        message.name || "Image";


      attachment.append(
        image,
        name
      );

      content.appendChild(
        attachment
      );

    }


    /* Text */

    const text =
      document.createElement("div");

    if(message.role === "assistant"){

      text.innerHTML =
        md(message.content);

    }else{

      text.innerHTML =
        escapeHTML(message.content)
          .replace(/\n/g,"<br>");

    }

    content.appendChild(text);

    row.append(
      avatar,
      content
    );

    chat.appendChild(row);

  });


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function renderPreview(){

  preview.innerHTML = "";

  preview.classList.toggle(
    "show",
    attachments.length > 0
  );


  attachments.forEach(
    (attachment,index) => {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "preview-item";


      const image =
        document.createElement("img");

      image.src =
        attachment.data;


      const remove =
        document.createElement("button");

      remove.className =
        "remove";

      remove.type =
        "button";

      remove.textContent =
        "×";


      remove.onclick = () => {

        attachments.splice(
          index,
          1
        );

        renderPreview();

      };


      wrapper.append(
        image,
        remove
      );

      preview.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function send(){

  if(isSending){
    return;
  }


  const text =
    input.value.trim();


  if(!text && !attachments.length){
    return;
  }


  let c = current();


  if(!c){

    fresh();

    c = current();

  }


  if(!c){
    console.error(
      "Unable to create Freddy conversation."
    );

    return;
  }


  if(c.title === "New chat"){

    c.title =
      (text || "Image").slice(
        0,
        42
      );

  }


  const images =
    attachments.map(
      attachment =>
        attachment.data
    );


  const firstImage =
    attachments[0];


  /* Add user message */

  c.messages.push({

    role:"user",

    content:
      text ||
      "Please analyze the attached image(s).",

    image:
      firstImage?.data || null,

    name:
      firstImage?.name || null

  });


  /* Clear composer */

  input.value = "";

  input.style.height =
    "auto";

  attachments = [];

  renderPreview();

  save();

  renderHistory();

  renderChat();


  /* Lock sending */

  isSending = true;

  sendButton.disabled = true;


  /* Typing indicator */

  const typing =
    document.createElement("div");

  typing.className =
    "message assistant";

  typing.innerHTML = `
    <div class="avatar">F</div>

    <div class="content">

      <span class="typing">
        <i></i>
        <i></i>
        <i></i>
      </span>

    </div>
  `;

  chat.appendChild(typing);

  chat.scrollTop =
    chat.scrollHeight;


  /* API request */

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      30000
    );


  try{

    const payload = {

      messages:
        c.messages.map(
          message => ({
            role:
              message.role,

            content:
              message.content
          })
        ),

      images

    };


    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            ),

          signal:
            controller.signal
        }
      );


    clearTimeout(timeout);


    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "The server returned an invalid response."
      );

    }


    typing.remove();


    if(!response.ok){

      throw new Error(
        data?.error ||
        "Freddy's AI backend returned an error."
      );

    }


    const reply =
      data?.reply ||
      "I didn't get a response.";


    c.messages.push({

      role:"assistant",

      content:reply

    });


    save();

    renderChat();


  }catch(error){

    clearTimeout(timeout);

    typing.remove();


    let errorMessage =
      "I couldn't reach Freddy's AI backend right now.";


    if(error.name === "AbortError"){

      errorMessage =
        "Freddy's AI backend took too long to respond. Check your Vercel deployment.";

    }else if(error.message){

      errorMessage =
        "⚠️ " + error.message;

    }


    c.messages.push({

      role:"assistant",

      content:errorMessage

    });


    save();

    renderChat();


    console.error(
      "Freddy API error:",
      error
    );

  }finally{

    isSending = false;

    sendButton.disabled = false;

    input.focus();

  }

}


/* =========================================================
   SIDEBAR
========================================================= */

function closeSide(){

  $("#sidebar")
    .classList
    .remove("open");

  $("#overlay")
    .classList
    .remove("show");

}


$("#menu").onclick = () => {

  $("#sidebar")
    .classList
    .add("open");

  $("#overlay")
    .classList
    .add("show");

};


$("#overlay").onclick =
  closeSide;


/* =========================================================
   NEW CHAT
========================================================= */

$("#newChat").onclick = () => {

  fresh();

  closeSide();

};


/* =========================================================
   CLEAR ALL
========================================================= */

$("#clearAll").onclick = () => {

  if(
    !confirm(
      "Clear all Freddy conversations?"
    )
  ){
    return;
  }


  conversations = [];

  currentId = null;

  save();

  fresh();

};


/* =========================================================
   SEARCH
========================================================= */

$("#search").oninput =
  event =>
    renderHistory(
      event.target.value
    );


/* =========================================================
   ATTACHMENTS
========================================================= */

$("#attach").onclick = () => {

  file.click();

};


file.onchange = async event => {

  const files =
    [...event.target.files];


  for(const selectedFile of files){

    if(
      selectedFile.type.startsWith(
        "image/"
      )
    ){

      const data =
        await new Promise(
          resolve => {

            const reader =
              new FileReader();

            reader.onload =
              () =>
                resolve(
                  reader.result
                );

            reader.readAsDataURL(
              selectedFile
            );

          }
        );


      attachments.push({

        data,

        name:
          selectedFile.name

      });

    }

  }


  file.value = "";

  renderPreview();

};


/* =========================================================
   FORM SUBMIT
========================================================= */

form.onsubmit = async event => {

  event.preventDefault();

  await send();

};


/* =========================================================
   TEXTAREA
========================================================= */

input.oninput = () => {

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      170
    ) + "px";

};


input.onkeydown = event => {

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    send();

  }

};


/* =========================================================
   THEME
========================================================= */

$("#theme").onclick = () => {

  document.body.classList.toggle(
    "light"
  );

};


/* =========================================================
   VOICE INPUT
========================================================= */

$("#voice").onclick = () => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice input isn't supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    navigator.language ||
    "en-US";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;


  recognition.onresult =
    event => {

      input.value =
        event
          .results[0][0]
          .transcript;

      input.dispatchEvent(
        new Event("input")
      );

      input.focus();

    };


  recognition.onerror =
    event => {

      console.error(
        "Voice recognition error:",
        event.error
      );

    };


  recognition.start();

};


/* =========================================================
   START APP
========================================================= */

if(!conversations.length){

  fresh();

}else{

  if(!current()){

    currentId =
      conversations[0].id;

    save();

  }

  renderHistory();

  renderChat();

}

</script>

</body>
</html>
