<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Freddy AI</title>
<style>
:root{--bg:#08090b;--panel:#17191d;--text:#f5f7fb;--muted:#9da3ad}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% -10%,#30394a 0,#08090b 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea{font:inherit}.app{height:100%;display:flex;flex-direction:column;max-width:1080px;margin:auto}
header{height:68px;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #ffffff12;background:#08090bad;backdrop-filter:blur(22px);z-index:5}
.mini{width:40px;height:36px;border-radius:13px;background:linear-gradient(145deg,#303640,#080a0e);border:1px solid #ffffff20;display:grid;place-items:center;box-shadow:inset 0 1px 2px #fff2,0 8px 24px #0008}
.mini:after{content:">_";font-weight:800;font-size:14px;color:#f4f7ff;text-shadow:0 0 10px #bcd5ff}.brand b{display:block}.brand span{font-size:12px;color:#8fd18f}.clear{margin-left:auto;border:0;background:transparent;color:#888;cursor:pointer}
.chat{flex:1;overflow:auto;padding:12px 18px 130px;scroll-behavior:smooth}.welcome{text-align:center;max-width:720px;margin:5vh auto 30px}.welcome h1{font-size:32px;letter-spacing:-.035em;margin:8px 0}.welcome p{color:var(--muted);margin:0 0 22px}
.face{width:178px;height:158px;margin:0 auto 27px;border-radius:48px;position:relative;background:linear-gradient(145deg,#303640,#101318 52%,#07090c);border:1px solid #bed7ff33;box-shadow:inset 0 2px 5px #fff2,inset 0 -18px 35px #0009,0 0 0 12px #7896cd09,0 25px 75px #000b,0 0 55px #96beff55;animation:float 5s ease-in-out infinite;transition:.4s}
.face:before{content:"";position:absolute;inset:7px;border-radius:42px;background:linear-gradient(135deg,#fff2,transparent 28%,transparent 72%,#78a0dc19)}
.screen{position:absolute;inset:15px;border-radius:37px;background:radial-gradient(circle at 50% 20%,#1c2532,#080a0e 66%);border:1px solid #fff1;box-shadow:inset 0 1px 3px #fff2,inset 0 -12px 22px #0009;display:grid;place-items:center;overflow:hidden}
.screen:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#fff1 45%,transparent 62%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite}
.prompt{position:relative;z-index:2;font-size:58px;font-weight:800;letter-spacing:-.12em;color:#f7faff;text-shadow:0 0 12px #bed7ffd9,0 0 34px #78aaff6b}.cursor{display:inline-block;width:26px;height:9px;border-radius:8px;background:#f7faff;vertical-align:middle;margin-left:5px;box-shadow:0 0 15px #cfe0ff}
.face.listening{transform:scale(1.06);box-shadow:inset 0 2px 5px #fff3,0 0 0 18px #82aaff10,0 0 70px #6eb4ff94,0 28px 85px #0009}.face.listening:after{content:"";position:absolute;inset:-24px;border-radius:62px;border:1px solid #96beff40;animation:ripple 1.45s ease-out infinite}
.face.thinking{box-shadow:inset 0 2px 5px #fff3,0 0 65px #a07dff7a,0 28px 85px #0009}.face.thinking .prompt{animation:pulse 1.1s ease-in-out infinite}.face.speaking{transform:scale(1.035);box-shadow:inset 0 2px 5px #fff3,0 0 75px #78d2ff9e,0 28px 85px #0009}.face.speaking .prompt{animation:speak .55s ease-in-out infinite alternate}
.status{height:22px;color:#9da3ad;font-size:13px;margin-top:-12px;margin-bottom:18px}.wave{height:22px;display:flex;gap:4px;justify-content:center;align-items:center;opacity:0}.wave.on{opacity:1}.wave i{width:3px;height:7px;border-radius:4px;background:#dce8ff;box-shadow:0 0 10px #a9c8ff;animation:wave 1s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.08s}.wave i:nth-child(3){animation-delay:.16s}.wave i:nth-child(4){animation-delay:.24s}.wave i:nth-child(5){animation-delay:.32s}
.suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.suggestions button{background:#17191dcc;border:1px solid #ffffff1a;color:#ddd;border-radius:18px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(14px)}
.msg{display:flex;margin:18px auto;max-width:780px;animation:in .32s ease both}.msg.user{justify-content:flex-end}.bubble{padding:12px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.user .bubble{background:#373b43b8;max-width:82%;border:1px solid #fff1}.ai .bubble{background:#16181cb8;border:1px solid #fff1;max-width:90%;backdrop-filter:blur(18px)}
.composer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 28px));display:flex;align-items:flex-end;gap:8px;padding:9px;border:1px solid #fff2;border-radius:25px;background:#16181dd1;backdrop-filter:blur(24px);box-shadow:0 18px 55px #0009;z-index:10}
.icon-btn,.send{flex:0 0 44px;width:44px;height:44px;border:0;border-radius:15px;cursor:pointer;display:grid;place-items:center}.icon-btn{background:#fff0a;color:#d9dee8;font-size:20px}.send{background:#f0f3f8;color:#0b0c0f;font-weight:800}
textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:white;padding:10px 8px;max-height:130px;min-height:44px;line-height:24px}textarea::placeholder{color:#7e858f}.typing{color:#999;font-size:13px;padding:8px}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes shine{50%,100%{transform:translateX(120%)}}@keyframes ripple{0%{transform:scale(.92);opacity:.65}100%{transform:scale(1.12);opacity:0}}@keyframes pulse{50%{opacity:.65;filter:blur(.6px)}}@keyframes speak{to{transform:scale(1.07)}}@keyframes wave{0%,100%{height:6px}50%{height:20px}}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:600px){header{height:62px;padding:10px 13px}.chat{padding:8px 12px 130px}.welcome{margin-top:7vh}.face{width:150px;height:134px;border-radius:42px}.screen{inset:13px;border-radius:32px}.prompt{font-size:48px}.welcome h1{font-size:28px}.suggestions button{font-size:13px}.composer{width:calc(100% - 18px);bottom:max(9px,env(safe-area-inset-bottom));border-radius:22px}}
</style>
</head>
<body>
<div class="app">
<header><div class="mini"></div><div class="brand"><b>Freddy</b><span>● AI online</span></div><button class="clear" id="clear">Clear</button></header>
<main class="chat" id="chat">
<section class="welcome" id="welcome">
<div class="face" id="face"><div class="screen"><div class="prompt">&gt;<span class="cursor"></span></div></div></div>
<div class="status" id="status">How can I help?</div>
<div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
<h1>Hey, I'm Freddy.</h1><p>Your AI assistant. Ask me anything.</p>
<div class="suggestions"><button>Explain something simply</button><button>Help me code</button><button>Give me study tips</button></div>
</section>
</main>
<form class="composer" id="form"><button class="icon-btn" type="button" id="mic">🎙</button><textarea id="input" rows="1" placeholder="Message Freddy..."></textarea><button class="send" type="submit">↑</button></form>
</div>
<script>
const chat=document.querySelector("#chat"),input=document.querySelector("#input"),form=document.querySelector("#form"),welcome=document.querySelector("#welcome"),face=document.querySelector("#face"),statusEl=document.querySelector("#status"),wave=document.querySelector("#wave"),mic=document.querySelector("#mic");
let messages=JSON.parse(localStorage.getItem("freddy_messages")||"[]"),recognition=null,listening=false;
function setState(s){face.classList.remove("listening","thinking","speaking");wave.classList.remove("on");if(s==="listening"){face.classList.add("listening");statusEl.textContent="Listening…";wave.classList.add("on")}else if(s==="thinking"){face.classList.add("thinking");statusEl.textContent="Thinking…"}else if(s==="speaking"){face.classList.add("speaking");statusEl.textContent="Speaking…";wave.classList.add("on")}else statusEl.textContent="How can I help?"}
function add(role,text,save=true){welcome.style.display="none";const row=document.createElement("div");row.className="msg "+role;const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;if(save)localStorage.setItem("freddy_messages",JSON.stringify(messages))}
function restore(){if(!messages.length)return;welcome.style.display="none";messages.forEach(m=>add(m.role==="assistant"?"ai":"user",m.content,false))}
async function send(text){if(!text.trim())return;add("user",text);messages.push({role:"user",content:text});localStorage.setItem("freddy_messages",JSON.stringify(messages));input.value="";input.style.height="auto";setState("thinking");const t=document.createElement("div");t.className="typing";t.textContent="Freddy is thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const data=await r.json();t.remove();if(!r.ok)throw new Error(data.error||"Request failed");setState("speaking");add("ai",data.reply);messages.push({role:"assistant",content:data.reply});localStorage.setItem("freddy_messages",JSON.stringify(messages));setTimeout(()=>setState("idle"),700)}catch(e){t.remove();setState("idle");add("ai","I couldn't reach my AI backend yet. Check your Vercel deployment and OPENAI_API_KEY environment variable.");console.error(e)}}
form.addEventListener("submit",e=>{e.preventDefault();send(input.value)});input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll(".suggestions button").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});
document.querySelector("#clear").onclick=()=>{messages=[];localStorage.removeItem("freddy_messages");document.querySelectorAll(".msg,.typing").forEach(x=>x.remove());welcome.style.display="";setState("idle")};
if("webkitSpeechRecognition" in window||"SpeechRecognition" in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang=navigator.language||"en-US";recognition.interimResults=false;recognition.onstart=()=>{listening=true;setState("listening");mic.textContent="■"};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event("input"))};recognition.onerror=()=>{listening=false;setState("idle");mic.textContent="🎙"};recognition.onend=()=>{listening=false;setState("idle");mic.textContent="🎙"};mic.onclick=()=>listening?recognition.stop():recognition.start()}else mic.onclick=()=>input.focus();
restore();setState("idle");
</script>
</body>
</html>
