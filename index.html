<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freddy AI</title>
<style>
:root{--bg:#0b0c0e;--panel:#17181b;--border:#2b2d31;--text:#f4f4f5;--muted:#9b9da3;--user:#303238}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#303238 0,#0b0c0e 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:auto}
header{height:68px;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(12,13,15,.72);backdrop-filter:blur(18px)}
.mini{width:40px;height:36px;border-radius:13px;background:linear-gradient(145deg,#e0e1e3,#74777c);position:relative;box-shadow:inset 0 2px 3px #fff6,0 5px 18px #0008}.mini:before,.mini:after{content:"";position:absolute;top:13px;width:6px;height:11px;border-radius:5px;background:#242529}.mini:before{left:10px}.mini:after{right:10px}.brand b{display:block}.brand span{font-size:12px;color:#8fd18f}
.chat{flex:1;overflow:auto;padding:28px 18px 130px}
.welcome{text-align:center;max-width:650px;margin:8vh auto 30px}.face{width:118px;height:105px;margin:auto auto 25px;border-radius:35px;background:linear-gradient(145deg,#e1e2e4,#85888d);position:relative;box-shadow:inset 0 4px 6px #fff8,inset 0 -15px 22px #0003,0 25px 70px #0008;animation:float 5s ease-in-out infinite}
.face .panel{position:absolute;inset:14px;border-radius:28px;background:linear-gradient(145deg,#3d3f43,#1f2023);box-shadow:inset 0 1px 2px #fff2}
.eye{position:absolute;top:30px;width:18px;height:23px;border-radius:10px;background:#eee}.eye:after{content:"";position:absolute;left:6px;top:6px;width:7px;height:10px;border-radius:50%;background:#333}.l{left:28px}.r{right:28px}.smile{position:absolute;left:50%;bottom:20px;width:25px;height:10px;transform:translateX(-50%);border-bottom:2px solid #bbb;border-radius:0 0 50% 50%}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 22px}.suggestions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.suggestions button{background:#17181b;border:1px solid var(--border);color:#ddd;border-radius:18px;padding:9px 13px;cursor:pointer}
.msg{display:flex;margin:18px auto;max-width:760px}.msg.user{justify-content:flex-end}.bubble{padding:12px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap}.user .bubble{background:var(--user);max-width:80%}.ai .bubble{background:#17181b;border:1px solid var(--border);max-width:88%}
.composer{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 28px));display:flex;gap:9px;padding:9px;border:1px solid var(--border);border-radius:23px;background:rgba(23,24,27,.9);backdrop-filter:blur(18px);box-shadow:0 15px 45px #0008}
textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:white;padding:10px 12px;font:inherit;max-height:130px}button.send{width:44px;height:44px;border:0;border-radius:15px;background:#eee;color:#111;font-size:18px;cursor:pointer}.clear{border:0;background:transparent;color:#888;cursor:pointer}
.typing{color:#999;font-size:13px;padding:8px}
@media(max-width:600px){h1{font-size:27px}.chat{padding-left:12px;padding-right:12px}.welcome{margin-top:5vh}.face{transform:scale(.9)}}
</style>
</head>
<body>
<div class="app">
<header><div class="mini"></div><div class="brand"><b>Freddy</b><span>● AI online</span></div><button class="clear" id="clear">Clear</button></header>
<main class="chat" id="chat">
<section class="welcome" id="welcome">
<div class="face"><div class="panel"><i class="eye l"></i><i class="eye r"></i><i class="smile"></i></div></div>
<h1>Hey, I'm Freddy.</h1><p>Your AI assistant. Ask me anything.</p>
<div class="suggestions"><button>Explain something simply</button><button>Help me code</button><button>Give me study tips</button></div>
</section>
</main>
<form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message Freddy..."></textarea><button class="send" type="submit">↑</button></form>
</div>
<script>
const chat=document.querySelector("#chat"), input=document.querySelector("#input"), form=document.querySelector("#form"), welcome=document.querySelector("#welcome");
let messages=[];
function add(role,text){welcome.style.display="none";const row=document.createElement("div");row.className="msg "+role;const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
async function send(text){if(!text.trim())return;add("user",text);messages.push({role:"user",content:text});input.value="";input.style.height="auto";const t=document.createElement("div");t.className="typing";t.textContent="Freddy is thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const data=await r.json();t.remove();if(!r.ok)throw new Error(data.error||"Request failed");add("ai",data.reply);messages.push({role:"assistant",content:data.reply})}catch(e){t.remove();add("ai","I couldn't reach my AI backend yet. Check your Vercel deployment and OPENAI_API_KEY environment variable.");console.error(e)}}
form.addEventListener("submit",e=>{e.preventDefault();send(input.value)});input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll(".suggestions button").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});document.querySelector("#clear").onclick=()=>{messages=[];document.querySelectorAll(".msg,.typing").forEach(x=>x.remove());welcome.style.display=""};
</script>
</body>
</html>
