<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Freddy AI</title>
<style>
:root{
  --bg:#000;--panel:#202020;--panel2:#2b2b2b;--border:#414141;
  --text:#f5f5f5;--muted:#b9b9b9;--blue:#58a9ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}button{color:inherit}
.app{height:100dvh;width:100%;display:flex;overflow:hidden;background:#000}
.sidebar{
 width:280px;background:#171717;display:flex;flex-direction:column;padding:12px;gap:8px;
 z-index:50;position:fixed;inset:0 auto 0 0;transform:translateX(-105%);
 transition:transform .22s ease;box-shadow:20px 0 70px #000;
}
.sidebar.open{transform:translateX(0)}
.newchat{height:44px;display:flex;align-items:center;gap:10px;border:1px solid #404040;
background:#242424;border-radius:12px;padding:0 13px;cursor:pointer}
.newchat:hover,.sidebtn:hover,.chatrow:hover{background:#303030}
.search{display:flex;align-items:center;gap:8px;color:#aaa;background:#222;border:1px solid #333;
padding:9px 11px;border-radius:10px}.search input{flex:1;background:none;border:0;outline:0;color:white}
.history{flex:1;overflow:auto}.chatrow{padding:10px;border-radius:9px;display:flex;gap:8px;cursor:pointer;
font-size:14px}.chatrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebottom{border-top:1px solid #303030;padding-top:7px}.sidebtn{display:block;width:100%;border:0;background:none;
text-align:left;padding:10px;border-radius:9px;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:45}.overlay.show{display:block}

.main{width:100%;height:100%;display:flex;flex-direction:column;position:relative;background:#000}
.topbar{
 height:92px;display:flex;align-items:center;justify-content:space-between;padding:20px 28px 12px;
 position:relative;z-index:10;background:#000;
}
.top-left{display:flex;align-items:center;gap:16px}
.menu,.voice-top{
 width:60px;height:60px;border-radius:50%;border:1px solid #444;background:#202020;
 display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px #ffffff12;
}
.menu:hover,.voice-top:hover{background:#2b2b2b}
.menu-lines{width:25px;display:grid;gap:7px}.menu-lines i{height:3px;background:#eee;border-radius:3px;display:block}
.plus-pill{
 height:60px;padding:0 27px;border-radius:31px;border:1px solid #4b5157;
 background:linear-gradient(145deg,#303a43,#283038);color:#59aaff;
 display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;box-shadow:inset 0 1px #ffffff18;
}
.plus-star{font-size:28px;color:#63b5ff;line-height:1}
.voice-top svg{width:31px;height:31px;stroke:#f2f2f2}

.chat{flex:1;overflow:auto;padding:0 24px 180px;position:relative}
.empty{
 max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
 padding-bottom:118px;
}
.empty .face{display:none}
.empty h1{display:none}.empty p{display:none}
.suggestions{
 display:flex;flex-direction:column;gap:29px;margin:0 0 18px 26px;align-items:flex-start;
}
.suggestions button{
 border:0;background:transparent;padding:0;color:#e8e8e8;font-size:24px;font-weight:600;
 cursor:pointer;display:flex;align-items:center;gap:22px;text-align:left;
}
.suggestions button:before{
 content:"";width:34px;height:34px;display:inline-grid;place-items:center;flex:0 0 34px;
}
.suggestions button:nth-child(1):before{content:"♧";font-size:39px;font-weight:400;transform:rotate(180deg)}
.suggestions button:nth-child(2):before{content:"▧";font-size:36px;font-weight:400}
.suggestions button:nth-child(3):before{content:"⌕";font-size:42px;font-weight:300}
.suggestions button:nth-child(4):before{content:"✦";font-size:31px}
.message{max-width:820px;margin:0 auto 27px;display:flex;gap:13px;line-height:1.65}
.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;
background:#444;display:grid;place-items:center;font-size:12px}.user .avatar{order:2;background:#eee;color:#222}
.content{max-width:calc(100% - 44px);overflow-wrap:anywhere}.user .content{background:#2f2f2f;
padding:10px 14px;border-radius:18px;max-width:min(720px,85%)}.ai .content{padding-top:1px}
.content pre{background:#151515;border:1px solid #444;padding:14px;border-radius:10px;overflow:auto}
.content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.content ul,.content ol{padding-left:22px}
.attachment{display:flex;align-items:center;gap:8px;background:#292929;border:1px solid #444;
padding:7px 9px;border-radius:9px;margin-bottom:8px;max-width:320px}.attachment img{width:42px;height:42px;object-fit:cover;border-radius:6px}

.composer-wrap{
 position:absolute;left:0;right:0;bottom:0;padding:0 24px 20px;
 background:linear-gradient(transparent,#000 30%);
}
.composer{
 max-width:820px;margin:auto;background:#242424;border:1px solid #454545;border-radius:32px;
 padding:8px 10px 8px 8px;box-shadow:0 10px 50px #000;
}
.preview{display:none;gap:8px;overflow:auto;padding:3px 5px 8px}.preview.show{display:flex}
.preview-item{position:relative}.preview-item img{width:60px;height:60px;object-fit:cover;border-radius:9px}
.remove{position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#444;width:20px;height:20px}
.inputrow{display:flex;align-items:center;gap:7px}
textarea{flex:1;resize:none;min-height:48px;max-height:160px;background:transparent;border:0;outline:0;
color:#fff;padding:12px 7px;font-size:21px}
.attach{
 width:52px;height:52px;border-radius:50%;border:0;background:transparent;font-size:42px;font-weight:300;
 line-height:1;cursor:pointer;color:#eee;display:grid;place-items:center
}
.attach:hover{background:#333}
.send{
 width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#111;cursor:pointer;
 display:grid;place-items:center;font-size:28px;font-weight:700;
}
.send:disabled{opacity:.35}
.hint{text-align:center;color:#888;font-size:11px;margin-top:9px}

@media(min-width:801px){
 .menu{width:46px;height:46px}.voice-top{width:46px;height:46px}
 .plus-pill{height:46px;font-size:17px;padding:0 20px}.plus-star{font-size:22px}
 .topbar{height:72px;padding:12px 20px}
 .suggestions button{font-size:19px}.suggestions{gap:23px;margin-left:10px}
 .empty{padding-bottom:110px}
 textarea{font-size:16px}.attach,.send{width:42px;height:42px}
}
@media(max-width:600px){
 .topbar{height:104px;padding:18px 28px 10px}
 .menu,.voice-top{width:60px;height:60px}
 .plus-pill{height:60px;font-size:21px;padding:0 25px}
 .chat{padding:0 16px 180px}
 .empty{padding-bottom:110px}
 .suggestions{gap:28px;margin-left:22px}
 .suggestions button{font-size:23px;gap:19px}
 .composer-wrap{padding:0 25px 20px}
 .composer{border-radius:31px}
 textarea{font-size:20px}
 .attach,.send{width:52px;height:52px}
 .hint{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="newchat" id="newChat">＋ <span>New chat</span></button>
    <label class="search">⌕ <input id="search" placeholder="Search chats"></label>
    <div class="history" id="history"></div>
    <div class="sidebottom">
      <button class="sidebtn" id="theme">☼ &nbsp; Theme</button>
      <button class="sidebtn" id="clearAll">⌫ &nbsp; Clear history</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <section class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu" id="menu" aria-label="Open menu">
          <span class="menu-lines"><i></i><i></i></span>
        </button>
        <div class="plus-pill"><span class="plus-star">✦</span> Get Plus</div>
      </div>
      <button class="voice-top" id="voice" title="Start voice chat" aria-label="Start voice chat">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M10 19c2-7 7-10 14-10 7 0 12 3 14 10" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M10 29c2 7 7 10 14 10 7 0 12-3 14-10" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M8 21v6M40 21v6" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M15 18v12M33 18v12" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <main class="chat" id="chat"></main>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <div class="preview" id="preview"></div>
        <div class="inputrow">
          <input id="file" type="file" accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.html,.css" multiple hidden>
          <button class="attach" type="button" id="attach" title="Attach files">＋</button>
          <textarea id="input" rows="1" placeholder="Ask Freddy"></textarea>
          <button class="send" id="send" type="submit">↑</button>
        </div>
      </form>
      <div class="hint">Freddy can make mistakes. Check important information.</div>
    </div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);
const chat=$("#chat"),input=$("#input"),form=$("#form"),file=$("#file"),preview=$("#preview");
let conversations=JSON.parse(localStorage.getItem("freddy_chats")||"[]");
let currentId=localStorage.getItem("freddy_current")||null;
let attachments=[];

function save(){localStorage.setItem("freddy_chats",JSON.stringify(conversations));localStorage.setItem("freddy_current",currentId||"")}
function current(){return conversations.find(c=>c.id===currentId)}
function fresh(){const c={id:crypto.randomUUID(),title:"New chat",messages:[],created:Date.now()};conversations.unshift(c);currentId=c.id;save();renderHistory();renderChat()}
function escape(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function md(s){
 let x=escape(s);
 x=x.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`);
 x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
 x=x.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
 x=x.replace(/\n/g,"<br>");
 return x;
}
function renderHistory(filter=""){
 const h=$("#history");h.innerHTML="";
 conversations.filter(c=>c.title.toLowerCase().includes(filter.toLowerCase())).slice(0,80).forEach(c=>{
  const b=document.createElement("div");b.className="chatrow";b.innerHTML=`💬 <span>${escape(c.title)}</span>`;
  b.onclick=()=>{currentId=c.id;save();renderChat();closeSide()};h.appendChild(b);
 });
}
function renderChat(){
 const c=current();chat.innerHTML="";
 if(!c||!c.messages.length){
  chat.innerHTML=`<section class="empty"><div class="face"><div class="prompt">&gt;_</div></div><h1>What can I help with?</h1><p>I'm Freddy — your AI assistant.</p><div class="suggestions"><button>Start a voice chat</button><button>Create an image or sticker</button><button>Write or edit</button></div></section>`;
  chat.querySelectorAll(".suggestions button").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});
  return;
 }
 c.messages.forEach(m=>{
  const row=document.createElement("div");row.className="message "+m.role;
  const av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"You":"F";
  const content=document.createElement("div");content.className="content";
  if(m.image){const a=document.createElement("div");a.className="attachment";a.innerHTML=`<img src="${m.image}"><span>${escape(m.name||"Image")}</span>`;content.appendChild(a)}
  const text=document.createElement("div");text.innerHTML=m.role==="assistant"?md(m.content):escape(m.content).replace(/\n/g,"<br>");content.appendChild(text);
  row.append(av,content);chat.appendChild(row);
 });
 chat.scrollTop=chat.scrollHeight;
}
function renderPreview(){
 preview.innerHTML="";preview.classList.toggle("show",attachments.length>0);
 attachments.forEach((a,i)=>{const d=document.createElement("div");d.className="preview-item";d.innerHTML=`<img src="${a.data}"><button class="remove">×</button>`;d.querySelector(".remove").onclick=()=>{attachments.splice(i,1);renderPreview()};preview.appendChild(d)});
}
async function send(){
 const text=input.value.trim();
 if(!text && !attachments.length)return;
 let c=current();if(!c){fresh();c=current()}
 if(c.title==="New chat")c.title=(text||"Image").slice(0,42);
 const imgs=attachments.map(a=>a.data);
 c.messages.push({role:"user",content:text||"Please analyze the attached image(s).",image:attachments[0]?.data,name:attachments[0]?.name});
 input.value="";input.style.height="auto";attachments=[];renderPreview();save();renderHistory();renderChat();
 const typing=document.createElement("div");typing.className="message assistant";typing.innerHTML=`<div class="avatar">F</div><div class="content"><span class="typing"><i></i><i></i><i></i></span></div>`;chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;
 try{
  const payload={messages:c.messages.map(m=>({role:m.role,content:m.content})),images:imgs};
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const data=await r.json();typing.remove();if(!r.ok)throw new Error(data.error||"Request failed");
  c.messages.push({role:"assistant",content:data.reply||"I didn't get a response."});save();renderChat();
 }catch(e){typing.remove();c.messages.push({role:"assistant",content:"I couldn't reach Freddy's AI backend right now. Check Vercel and your OPENAI_API_KEY."});save();renderChat();console.error(e)}
}
function closeSide(){$("#sidebar").classList.remove("open");$("#overlay").classList.remove("show")}
$("#newChat").onclick=fresh;$("#clearCurrent").onclick=()=>{if(current()){current().messages=[];current().title="New chat";save();renderChat();renderHistory()}};
$("#clearAll").onclick=()=>{if(confirm("Clear all Freddy conversations?")){conversations=[];currentId=null;save();fresh()}};
$("#search").oninput=e=>renderHistory(e.target.value);
$("#attach").onclick=()=>file.click();
file.onchange=async e=>{for(const f of [...e.target.files]){if(f.type.startsWith("image/")){const data=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f)});attachments.push({data,name:f.name})}}file.value="";renderPreview()};
form.onsubmit=e=>{e.preventDefault();send()};
input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,170)+"px"};
input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("#menu").onclick=()=>{$("#sidebar").classList.add("open");$("#overlay").classList.add("show")};$("#overlay").onclick=closeSide;
$("#theme").onclick=()=>document.body.classList.toggle("light");
$("#voice").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Voice input isn't supported in this browser.");return}
 const r=new SR();r.lang=navigator.language||"en-US";r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event("input"));input.focus()};r.start();
};
if(!conversations.length)fresh();else{if(!current())currentId=conversations[0].id;renderHistory();renderChat()}
</script>
</body>
</html>
